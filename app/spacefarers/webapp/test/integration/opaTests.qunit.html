<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Spacefarers OPA Tests</title>
  <script>
    window["sap-ui-config"] = { bindingSyntax: "complex", async: true };
  </script>
  <script
    id="sap-ui-bootstrap"
    src="https://sapui5.hana.ondemand.com/1.149.0/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-language="en"
    data-sap-ui-libs="sap.m"
    data-sap-ui-resourceroots='{
      "galactic.spacefarer.spacefarers.spacefarers": "../../"
    }'
    data-sap-ui-animation="false"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="trusted"
  ></script>
  <link
    rel="stylesheet"
    type="text/css"
    href="https://sapui5.hana.ondemand.com/1.149.0/resources/sap/ui/thirdparty/qunit-2.css"
  />
  <script src="https://sapui5.hana.ondemand.com/1.149.0/resources/sap/ui/thirdparty/qunit-2.js"></script>
  <script>
    QUnit.config.autostart = false;
    // FLP sandbox often emits cross-origin "Script error." that should not fail OPA.
    window.addEventListener(
      "error",
      function (event) {
        if (event && String(event.message || "").indexOf("Script error") !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      },
      true
    );
  </script>
  <script src="./opaTests.qunit.js"></script>
</head>
<body>
  <div id="qunit"></div>
  <div id="qunit-fixture"></div>
</body>
</html>
